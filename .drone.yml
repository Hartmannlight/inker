---
# Pipeline: Release on tag
kind: pipeline
type: docker
name: inker-release
node:
  type: docker
  name: builder

concurrency:
  limit: 1

trigger:
  event:
    - tag

steps:
  - name: write-version
    image: alpine/git
    commands:
      - echo "${DRONE_TAG}" > VERSION
      - git rev-parse --short HEAD > COMMIT
      - echo "release" > BRANCH
      - echo "Version:" && cat VERSION
      - echo "Commit:" && cat COMMIT

  - name: test-backend
    image: oven/bun:1-alpine
    commands:
      - cd backend
      - bun install --frozen-lockfile
      - bun test

  - name: test-frontend
    image: oven/bun:1-alpine
    commands:
      - cd frontend
      - bun install --frozen-lockfile
      - bun run test

  - name: build
    image: docker:27-cli
    commands:
      - echo "Building inker:$DRONE_TAG"
      - docker buildx build --pull --platform linux/amd64 --load --tag inker:$DRONE_TAG .

  - name: push-registry
    image: docker:27-cli
    commands:
      - docker tag inker:$DRONE_TAG registry.bor6.pl/inker:$DRONE_TAG
      - docker tag inker:$DRONE_TAG registry.bor6.pl/inker:latest
      - docker push registry.bor6.pl/inker:$DRONE_TAG
      - docker push registry.bor6.pl/inker:latest

  - name: push-dockerhub
    image: docker:27-cli
    environment:
      DOCKER_PASSWORD:
        from_secret: WOJO_DOCKERHUB
    commands:
      - echo "$DOCKER_PASSWORD" | docker login -u wojooo --password-stdin
      - docker tag inker:$DRONE_TAG wojooo/inker:$DRONE_TAG
      - docker tag inker:$DRONE_TAG wojooo/inker:latest
      - docker push wojooo/inker:$DRONE_TAG
      - docker push wojooo/inker:latest

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.6.196
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - cd ~/inker
        - docker compose pull
        - docker compose up -d
        - echo "Deployed successfully"

  - name: summary
    image: alpine
    commands:
      - |
        echo "================================================"
        echo "Release build and deploy complete!"
        echo "================================================"
        echo ""
        echo "Private registry:"
        echo "  registry.bor6.pl/inker:$DRONE_TAG"
        echo "  registry.bor6.pl/inker:latest"
        echo ""
        echo "Docker Hub:"
        echo "  wojooo/inker:$DRONE_TAG"
        echo "  wojooo/inker:latest"
        echo ""
        echo "Deployed to 192.168.6.196"
        echo "================================================"
