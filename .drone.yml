# Pipeline: Build and push image on main branch
kind: pipeline
type: docker
name: inker-build
node:
  type: docker
  name: builder

concurrency:
  limit: 1

trigger:
  branch:
    - main
  event:
    - push

steps:
  - name: check-changes
    image: alpine/git
    commands:
      - |
        # Skip if this commit is tagged (release pipeline handles it)
        git fetch --tags 2>/dev/null || true
        if git describe --exact-match HEAD 2>/dev/null; then
          echo "Commit is tagged, skipping (release pipeline will handle)"
          exit 78
        fi
        # Get list of changed files in this commit (use git show for shallow clones)
        CHANGED=$(git show --name-only --pretty=format: HEAD | grep -v '^$')
        echo "Changed files:"
        echo "$CHANGED"
        echo ""
        # Check if any source files changed (exclude docs/readme)
        APP_CHANGES=$(echo "$CHANGED" | grep -v "\.md$" | grep -v "^README" | grep -v "^\.git" || true)
        if [ -z "$APP_CHANGES" ]; then
          echo "No source files changed, skipping build"
          exit 78
        fi
        echo "Source files changed:"
        echo "$APP_CHANGES"

  - name: write-version
    image: alpine/git
    commands:
      - git fetch --tags 2>/dev/null || true
      - git describe --tags --abbrev=0 2>/dev/null > VERSION || echo "unknown" > VERSION
      - git rev-parse --short HEAD > COMMIT || echo "unknown" > COMMIT
      - git rev-parse --abbrev-ref HEAD > BRANCH || echo "unknown" > BRANCH
      - echo "Version:" && cat VERSION
      - echo "Commit:" && cat COMMIT
      - echo "Branch:" && cat BRANCH

  - name: test-backend
    image: oven/bun:1-alpine
    commands:
      - cd backend
      - bun install --frozen-lockfile
      - bun test

  - name: test-frontend
    image: oven/bun:1-alpine
    commands:
      - cd frontend
      - bun install --frozen-lockfile
      - bun run test

  - name: build
    image: docker:27-cli
    commands:
      - COMMIT_SHORT=$(echo $DRONE_COMMIT_SHA | cut -c1-8)
      - echo "Building registry.bor6.pl/inker:$COMMIT_SHORT"
      - docker buildx build --pull --no-cache --platform linux/amd64 --tag registry.bor6.pl/inker:$COMMIT_SHORT --tag registry.bor6.pl/inker:latest --push .

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.6.196
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - cd ~/inker
        - docker compose pull
        - docker compose up -d
        - echo "Deployed successfully"

  - name: summary
    image: alpine
    commands:
      - |
        COMMIT_SHORT=$(echo $DRONE_COMMIT_SHA | cut -c1-8)
        echo "================================================"
        echo "Build and deploy complete!"
        echo "================================================"
        echo ""
        echo "Image pushed:"
        echo "  registry.bor6.pl/inker:$COMMIT_SHORT"
        echo "  registry.bor6.pl/inker:latest"
        echo ""
        echo "Deployed to 192.168.6.196"
        echo "================================================"

