services:
  # Bun Backend API (SQLite — single-file DB on the uploads volume)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: inker-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    ports:
      - "3002:3002"
      - "9229:9229"
    environment:
      TZ: ${TZ:-UTC}
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: file:./uploads/inker.db
      CORS_ORIGINS: "*"
      ADMIN_PIN: "${ADMIN_PIN:-1111}"
      LOG_LEVEL: debug
    command: sh -c "bun install && bunx prisma generate && bunx prisma db push --skip-generate --accept-data-loss && bun run db:seed && bun run start:dev"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - inker-network

  # React Frontend (Bun + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: inker-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_URL: http://backend:3002
      # VITE_ALLOWED_HOSTS: your-domain.com  # Optional: restrict to specific domains (comma-separated)
    depends_on:
      - backend
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    networks:
      - inker-network

networks:
  inker-network:
    driver: bridge
