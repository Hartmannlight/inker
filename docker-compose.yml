services:
  inker:
    build: .
    image: ${INKER_IMAGE:-inker:latest}
    container_name: inker
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${INKER_PORT:-80}:80"
    volumes:
      - uploads_data:/app/uploads
      - secrets_data:/app/secrets
      - render_data:/app/render-cache
    environment:
      TZ: ${TZ:-UTC}
      ADMIN_PIN: "${ADMIN_PIN:?Set ADMIN_PIN to a non-default value before starting Inker}"
      INKER_INSTANCE_SECRET_PATH: /app/secrets/instance.json
      INKER_PORT: "${INKER_PORT:-80}"
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      # Federation is closed by default. Private origins must also be explicitly allowed.
      FEDERATION_ALLOWED_ORIGINS: "${FEDERATION_ALLOWED_ORIGINS:-}"
      FEDERATION_PRIVATE_ORIGINS: "${FEDERATION_PRIVATE_ORIGINS:-}"
      FEDERATION_TRUSTED_PROXIES: "${FEDERATION_TRUSTED_PROXIES:-}"
      # Inker stores all data in a single SQLite file under the uploads volume
      # (/app/uploads/inker.db). No external database is required.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  # All application data, including the SQLite database (inker.db).
  uploads_data:
    driver: local
  # Versioned instance encryption keys. Back up with, but separately from, uploads_data.
  secrets_data:
    driver: local
  # Private immutable render files; include with the database in backups.
  render_data:
    driver: local
